[package]
name = "telescope-cli"
description = "Command-line front end for the Telescope engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
telescope-core = { path = "../telescope-core" }
telescope-grep = { path = "../telescope-grep" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
