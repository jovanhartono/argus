[package]
name = "argus-cli"
description = "Command-line front end for the Argus engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
argus-core = { path = "../argus-core" }
argus-grep = { path = "../argus-grep" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
