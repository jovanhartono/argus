name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # Xcode 26's Swift compiler crashes on the tests; this matches the Xcode the app is built with.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p argus-ffi
      - name: DIAG plain
        continue-on-error: true
        run: swift test --package-path apps/macos --filter 'testTabGoesOnFromAHotkeyRecorder|testAnEjectTriedAgainStartsTheWaitOver|testCommandIOpensThePaneBesideThePickedFileAndClosesIt|testTabOntoARowBelowTheBottomEdgeScrollsItIntoView'
      - name: DIAG with keyboard access
        continue-on-error: true
        run: |
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
          defaults read NSGlobalDomain AppleKeyboardUIMode
          swift test --package-path apps/macos --filter 'testTabGoesOnFromAHotkeyRecorder|testTabOntoARowBelowTheBottomEdgeScrollsItIntoView'

  windows:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
